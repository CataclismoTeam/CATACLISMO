[project]
name = "cataclismo-backend"
version = "0.0.0"
description = "API de CATACLISMO: FastAPI + PostGIS + WebSockets"
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.32.0",
    "fastapi>=0.162.7",
    "geoalchemy2>=0.21.0",
    "pillow>=12.0.0",
    "pydantic-settings>=2.16.3",
    "sqlalchemy[asyncio]>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
trainer = [
    "keras>=3.8.0",
    "numpy>=2.1.0",
    "pandas>=2.2.3",
    "pyarrow>=18.0.0",
    "requests>=2.32.3",
    "scipy>=1.14.1",
    "tensorflow>=2.20.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pip-audit>=2.10.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ASYNC"]
ignore = ["S101"] # assert en los tests

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "trainer: pruebas de pipelines de datos y entrenamiento ML (VALEN/CATA/LUCIA)",
]
