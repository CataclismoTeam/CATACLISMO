[project]
name = "build-hotspots"
version = "1.0.0"
description = "Armoniza las detecciones FIRMS de MODIS y VIIRS y genera los agregados de la web"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.1",
    "polars>=1.20",
    "shapely>=2.2.0",
]

[project.scripts]
build-hotspots = "build_hotspots.cli:main"
build-escape-routes = "build_hotspots.escape:main"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["build_hotspots"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"] # assert en los tests

[tool.pytest.ini_options]
testpaths = ["tests"]
