name: Mejora
description: Propón una función o un cambio
title: 'feat: '
labels: [mejora]
body:
  - type: textarea
    id: problema
    attributes:
      label: ¿Qué problema resuelve?
    validations:
      required: true
  - type: textarea
    id: propuesta
    attributes:
      label: Propuesta
      description: Cómo lo harías.
    validations:
      required: true
  - type: checkboxes
    id: alcance
    attributes:
      label: Afecta a
      options:
        - label: Web (frontend, globo 3D, capas)
        - label: API (backend) o base de datos
        - label: CI/CD o seguridad
