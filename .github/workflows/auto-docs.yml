name: AI Technical Documentation PR

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-docs-pr:
    runs-on: ubuntu-latest
    # Evita que se dispare si el commit viene del propio bot de documentación
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Google GenAI SDK
        run: pip install google-genai

      - name: Extract modified files and generate documentation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # Si es el primer commit del repo, toma todos los archivos; si no, compara con el commit anterior
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            CHANGED_FILES=$(git diff --name-only --diff-filter=ACMRT HEAD~1 HEAD | grep -vE '(\.md$|^docs/|^scripts/generate_docs\.py$|\.github/)' || true)
          else
            CHANGED_FILES=$(git ls-files | grep -vE '(\.md$|^docs/|^scripts/generate_docs\.py$|\.github/)' || true)
          fi

          if [ -z "$CHANGED_FILES" ]; then
            echo "No relevant source code changes detected. Exiting."
            exit 0
          fi

          echo "Files to document:"
          echo "$CHANGED_FILES"

          python scripts/generate_docs.py $CHANGED_FILES

      - name: Create Pull Request with updated documentation
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: |
            docs/TECHNICAL_DOCS.md
          commit-message: "docs(ai): update technical documentation [skip ci]"
          branch: docs/auto-technical-docs
          delete-branch: true
          title: "docs: Automated Technical Documentation Update"
          body: |
            ## 🤖 Automated Technical Documentation Update
            
            This Pull Request was automatically generated by **Gemini (`gemini-2.5-flash`)** following the latest push to `main` (${{ github.sha }}).
            
            ### 📄 Updated File
            - `docs/TECHNICAL_DOCS.md`
            
            ### 🔍 Review Checklist
            - [ ] Verify that architecture diagrams (Mermaid.js) accurately reflect the current system flow.
            - [ ] Check that new function signatures, parameters, and endpoints are properly described.
          labels: |
            documentation
            automated-pr
