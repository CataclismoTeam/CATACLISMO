# Documentación técnica con IA: tras cada push a main, Gemini actualiza docs/TECHNICAL_DOCS.md
# a partir de los ficheros modificados y abre (o actualiza) un PR con el cambio.
# Necesita el secreto GEMINI_API_KEY y, en Settings → Actions, permitir que GitHub Actions
# cree pull requests.
name: AI Technical Documentation PR

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/**'

# Un solo run a la vez; si entra otro push, el anterior se cancela (evita PRs que se pisan)
concurrency:
  group: auto-docs
  cancel-in-progress: true

# Por defecto sin permisos; el job pide solo lo que necesita
permissions: {}

jobs:
  generate-docs-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write # rama con la documentación
      pull-requests: write # PR de documentación
    # Los reintentos con espera pueden tardar; con 10 min un 503 largo cortaría el job
    timeout-minutes: 20
    # Evita que se dispare si el commit viene del propio bot de documentación o de release-please
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !startsWith(github.event.head_commit.message, 'chore(main): release')"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install Google GenAI SDK
        run: pip install google-genai==3.3.0

      - name: Extract modified files and generate documentation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Opcionales (variables del repo): cambiar de modelo o definir reservas sin tocar el código
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_FALLBACK_MODELS: ${{ vars.GEMINI_FALLBACK_MODELS }}
          BEFORE: ${{ github.event.before }}
          # Solo código fuente: ni documentación, CI, lockfiles, binarios, datos generados, tests
          # ni capturas de regresión visual
          EXCLUDE: '(\.md$|^docs/|^scripts/maintenance/generate_docs\.py$|\.github/|pnpm-lock\.yaml$|uv\.lock$|\.(png|jpe?g|webp|svg|ico|gif|json|geojson|csv|parquet|pmtiles)$|/public/data/|^tests/|^dist/)'
        run: |
          # Compara con lo que había antes del push entero (no solo el último commit: un push con
          # varios commits perdería ficheros). Primer push o rama nueva: solo el último commit.
          if [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -qE '^0+$' && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            CHANGED_FILES=$(git diff --name-only --diff-filter=ACMRT "$BEFORE" HEAD | grep -vE "$EXCLUDE" || true)
          elif git rev-parse HEAD~1 >/dev/null 2>&1; then
            CHANGED_FILES=$(git diff --name-only --diff-filter=ACMRT HEAD~1 HEAD | grep -vE "$EXCLUDE" || true)
          else
            CHANGED_FILES=$(git ls-files | grep -vE "$EXCLUDE" || true)
          fi

          if [ -z "$CHANGED_FILES" ]; then
            echo "No relevant source code changes detected. Exiting."
            exit 0
          fi

          echo "Files to document:"
          echo "$CHANGED_FILES"

          mapfile -t FILES <<<"$CHANGED_FILES"
          python scripts/maintenance/generate_docs.py "${FILES[@]}"

      - name: Create Pull Request with updated documentation
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: |
            docs/TECHNICAL_DOCS.md
          commit-message: 'docs(ai): update technical documentation [skip ci]'
          branch: docs/auto-technical-docs
          delete-branch: true
          title: 'docs: Automated Technical Documentation Update'
          body: |
            ## 🤖 Automated Technical Documentation Update

            This Pull Request was automatically generated by **Gemini (`${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}`)** following the latest push to `main` (${{ github.sha }}).

            ### 📄 Updated File
            - `docs/TECHNICAL_DOCS.md`

            ### 🔍 Review Checklist
            - [ ] Verify that architecture diagrams (Mermaid.js) accurately reflect the current system flow.
            - [ ] Check that new function signatures, parameters, and endpoints are properly described.
          labels: |
            documentation
            automated-pr
