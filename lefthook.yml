# Hooks de git locales: los mismos controles rápidos del CI, antes de que el commit salga del equipo.
# Se instalan solos con `pnpm install` (script "prepare"). Saltarlos: LEFTHOOK=0 git commit ...
pre-commit:
  parallel: true
  jobs:
    - name: guardián
      run: node tools/dev-utils/guard.mjs --staged

    - name: formato
      glob: '*.{ts,tsx,mjs,js,json,yml,yaml,md,css,html}'
      exclude: 'backend/**'
      run: pnpm exec prettier --check --ignore-path .gitignore --ignore-path config/application/prettierignore {staged_files}

    - name: backend
      glob: 'backend/**/*.py'
      root: backend/
      run: uv run ruff check . && uv run ruff format --check .

    - name: secretos
      # gitleaks es opcional en local (en el CI siempre se ejecuta)
      run: command -v gitleaks >/dev/null && gitleaks git --pre-commit --staged --redact --gitleaks-ignore-path config/.gitleaksignore || echo "gitleaks no instalado; se omite en local"

commit-msg:
  jobs:
    - name: conventional-commits
      run: node tools/dev-utils/commit-msg.mjs {1}
